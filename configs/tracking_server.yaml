# MLflow Tracking Server Configuration
server:
  host: 0.0.0.0
  port: 5000
  workers: 4

backend_store:
  type: postgresql
  uri: postgresql://mlflow:mlflow123@localhost:5432/mlflow

artifact_store:
  type: s3
  bucket: mlflow-artifacts
  endpoint_url: http://localhost:9000

auth:
  enabled: false

logging:
  level: INFO
