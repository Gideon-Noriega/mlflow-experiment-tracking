name: ML Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MLFLOW_TRACKING_URI: http://localhost:5000
  MLFLOW_S3_ENDPOINT_URL: http://localhost:9000
  AWS_ACCESS_KEY_ID: mlflow
  AWS_SECRET_ACCESS_KEY: mlflow123

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/
      - name: Type check
        run: mypy src/

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mlflow
          POSTGRES_PASSWORD: mlflow123
          POSTGRES_DB: mlflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/ -v -m unit --cov=src --cov-report=xml

  train-and-validate:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Train models
        run: |
          python -m src.experiments.sklearn_experiment
          python -m src.experiments.xgboost_experiment
      - name: Tune best model
        run: python -m src.tuning.optuna_tuning
      - name: Validate and promote
        run: python -m src.registry.promote
