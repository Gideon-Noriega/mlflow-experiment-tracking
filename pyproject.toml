[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlflow-experiment-tracking"
version = "1.0.0"
description = "Production-grade MLflow experiment tracking showcase"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

dependencies = [
    "mlflow>=2.12.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "optuna>=3.6.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "boto3>=1.34.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "shap>=0.45.0",
]

[project.optional-dependencies]
pytorch = [
    "torch>=2.2.0",
]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require MLflow server)",
]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
